name: Release

# Tag v* chạy lại toàn bộ CI trước khi đóng gói APK/AAB và tạo GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag khớp version trong app/pubspec.yaml
        run: |
          raw=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | tr -d '\r')
          name="${raw%%+*}"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$raw" ]; then
            echo "::error::Không đọc được version trong app/pubspec.yaml"
            exit 1
          fi
          if [ "$tag" != "$name" ] && [ "$tag" != "$raw" ]; then
            echo "::error::Tag $GITHUB_REF_NAME không khớp version ($raw) trong app/pubspec.yaml"
            exit 1
          fi

  ci:
    needs: version
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Đóng gói APK và App Bundle phát hành
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release
      - name: Gom tệp phát hành
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/wholewell-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/wholewell-${GITHUB_REF_NAME}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 14
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - name: Tạo GitHub Release cho tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "WholeWell ${GITHUB_REF_NAME#v}"
          fi
