name: Release

# Tag v* chạy lại toàn bộ CI trước khi đóng gói APK/AAB và tạo GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag khớp version trong app/pubspec.yaml
        run: |
          raw=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | tr -d '\r')
          name="${raw%%+*}"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$raw" ]; then
            echo "::error::Không đọc được version trong app/pubspec.yaml"
            exit 1
          fi
          if [ "$tag" != "$name" ] && [ "$tag" != "$raw" ]; then
            echo "::error::Tag $GITHUB_REF_NAME không khớp version ($raw) trong app/pubspec.yaml"
            exit 1
          fi

  ci:
    needs: version
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Lấy khóa ký phát hành từ secrets (thiếu thì dừng, không phát hành bản ký bằng khóa debug)
        env:
          WW_KEYSTORE_BASE64: ${{ secrets.WW_KEYSTORE_BASE64 }}
          WW_KEYSTORE_PASSWORD: ${{ secrets.WW_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.WW_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.WW_KEY_PASSWORD }}
        run: |
          for v in WW_KEYSTORE_BASE64 WW_KEYSTORE_PASSWORD WW_KEY_ALIAS WW_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret $v"; exit 1; fi
          done
          echo "$WW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "WW_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Đóng gói APK và App Bundle prod (obfuscate, tách symbol)
        working-directory: app
        env:
          WW_KEYSTORE_PASSWORD: ${{ secrets.WW_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.WW_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.WW_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor prod --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
          flutter build appbundle --release --flavor prod --obfuscate --split-debug-info=build/symbols
      - name: Kiểm APK không ký bằng khóa debug
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-prod-release.apk)
          echo "$certs" | grep -i "sha-256"
          if echo "$certs" | grep -q "CN=Android Debug"; then echo "::error::APK ký bằng khóa debug"; exit 1; fi
      - name: Lưu symbol để đọc stack trace từ Play Console
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: app/build/symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Gom tệp phát hành
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "dist/wholewell-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/app/outputs/bundle/prodRelease/app-prod-release.aab "dist/wholewell-${GITHUB_REF_NAME}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 14
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - name: Tạo GitHub Release cho tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "WholeWell ${GITHUB_REF_NAME#v}"
          fi
