name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Sinh lại ảnh golden (tải artifact goldens về app/test/goldens/ rồi commit)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Mọi job dùng Flutter ghim trong .fvmrc (kể cả package thuần Dart): workspace giải phụ thuộc chung,
# Dart của setup-dart khác Dart đi kèm Flutter nên lock sẽ lệch (docs/refactor-plan.md, ADR 10).
jobs:
  data-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sinh và kiểm gói dữ liệu
        run: |
          python3 tools/build_pack.py
          python3 tools/verify_pack.py
          python3 tools/reference_engine.py
          git diff --exit-code -- packages/health_engine/assets app/assets packages/health_engine/test/fixtures
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Test engine
        working-directory: packages/health_engine
        run: |
          dart analyze
          dart test

  food-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Test thư viện món (SQLite FTS5)
        working-directory: packages/food_library
        run: |
          dart analyze
          dart test

  dsld-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Test thư viện bổ sung NIH DSLD (SQLite FTS5)
        working-directory: packages/dsld_library
        run: |
          dart analyze
          dart test

  journal-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Test CSDL mã hóa (SQLite3MultipleCiphers)
        working-directory: packages/journal_db
        run: |
          dart analyze
          dart test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Lấy phụ thuộc workspace (một lần ở gốc, đúng pubspec.lock đã commit)
        run: flutter pub get --enforce-lockfile
      - name: Kiểm định dạng (dart format, độ rộng 120 khai trong analysis_options.yaml)
        run: dart format --output=none --set-exit-if-changed app packages
      - name: Kiểm phụ thuộc và phân tích app
        working-directory: app
        run: |
          # CSDL phải dùng SQLite3MultipleCiphers, không kéo theo bản SQLite thường.
          if flutter pub deps --style=compact | grep -q sqlite3_flutter_libs; then
            echo "Không được dùng sqlite3_flutter_libs"; exit 1
          fi
          flutter analyze
      - name: Sinh lại ảnh golden (chỉ khi chạy bằng tay với update_goldens)
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        working-directory: app
        run: flutter test --tags golden --update-goldens
      - name: Lưu ảnh golden vừa sinh
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/goldens/*.png
          retention-days: 7
          if-no-files-found: error
      - name: Test app (gồm golden, chỉ chạy trên Linux)
        working-directory: app
        run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build APK prod arm64 và kiểm kích thước (ADR 0014)
        working-directory: app
        env:
          # Ngân sách APK prod arm64 (byte). Mốc 29/11/2026: 101.497.154. Muốn tăng thì ghi lý do vào status.md.
          APK_BUDGET_BYTES: "105000000"
        run: |
          flutter build apk --release --flavor prod --target-platform android-arm64
          size=$(stat -c %s build/app/outputs/flutter-apk/app-prod-release.apk)
          echo "APK prod arm64: $size byte (ngân sách $APK_BUDGET_BYTES)"
          if [ "$size" -gt "$APK_BUDGET_BYTES" ]; then
            echo "::error::APK prod arm64 $size byte vượt ngân sách $APK_BUDGET_BYTES"; exit 1
          fi
      - name: Build APK dev (debug, arm64) để cài thử
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: flutter build apk --debug --flavor dev --target-platform android-arm64
      - name: Lưu APK dev ("WholeWell Dev", app riêng, không đụng dữ liệu bản thật)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wholewell-dev-debug-apk
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Test JVM phần Kotlin (kho khóa)
        working-directory: app/android
        run: ./gradlew :app:testProdDebugUnitTest --no-daemon

  ci-ok:
    if: always()
    needs:
      - data-and-engine
      - food-library
      - dsld-library
      - journal-db
      - app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tổng hợp kết quả CI
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
