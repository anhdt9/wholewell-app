name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sinh và kiểm gói dữ liệu
        run: |
          python3 tools/build_pack.py
          python3 tools/verify_pack.py
          python3 tools/reference_engine.py
          git diff --exit-code -- packages/health_engine/assets app/assets packages/health_engine/test/fixtures
      - uses: dart-lang/setup-dart@v1
      - name: Test engine
        working-directory: packages/health_engine
        run: |
          dart pub get
          dart analyze
          dart test

  food-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test thư viện món (SQLite FTS5)
        working-directory: packages/food_library
        run: |
          dart pub get
          dart analyze
          dart test

  dsld-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test thư viện bổ sung NIH DSLD (SQLite FTS5)
        working-directory: packages/dsld_library
        run: |
          dart pub get
          dart analyze
          dart test

  journal-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test CSDL mã hóa (SQLite3MultipleCiphers)
        working-directory: packages/journal_db
        run: |
          dart pub get
          dart analyze
          dart test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test app
        working-directory: app
        run: |
          flutter pub get
          # CSDL phải dùng SQLite3MultipleCiphers, không kéo theo bản SQLite thường.
          if flutter pub deps --style=compact | grep -q sqlite3_flutter_libs; then
            echo "Không được dùng sqlite3_flutter_libs"; exit 1
          fi
          flutter analyze
          flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Android (debug)
        if: github.ref == 'refs/heads/main'
        working-directory: app
        run: flutter build apk --debug
      - name: Lưu APK debug để cài thử (chỉ thử nội bộ)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wholewell-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Test JVM phần Kotlin (kho khóa)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
