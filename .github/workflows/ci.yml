name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  data-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sinh và kiểm gói dữ liệu
        run: |
          python3 tools/build_pack.py
          python3 tools/verify_pack.py
          python3 tools/reference_engine.py
          git diff --exit-code -- packages/health_engine/assets app/assets packages/health_engine/test/fixtures
      - uses: dart-lang/setup-dart@v1
      - name: Test engine
        working-directory: packages/health_engine
        run: |
          dart pub get
          dart analyze
          dart test

  food-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test thư viện món (SQLite FTS5)
        working-directory: packages/food_library
        run: |
          dart pub get
          dart analyze
          dart test

  dsld-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test thư viện bổ sung NIH DSLD (SQLite FTS5)
        working-directory: packages/dsld_library
        run: |
          dart pub get
          dart analyze
          dart test

  journal-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Test CSDL mã hóa (SQLite3MultipleCiphers)
        working-directory: packages/journal_db
        run: |
          dart pub get
          dart analyze
          dart test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test app
        working-directory: app
        run: |
          flutter pub get
          # CSDL phải dùng SQLite3MultipleCiphers, không kéo theo bản SQLite thường.
          if flutter pub deps --style=compact | grep -q sqlite3_flutter_libs; then
            echo "Không được dùng sqlite3_flutter_libs"; exit 1
          fi
          flutter analyze
          flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Tạo cấu hình Gradle (tạo gradlew không build APK)
        if: github.event_name != 'workflow_dispatch'
        working-directory: app
        run: flutter build apk --config-only
      - name: Build Android (debug, arm64-v8a cho S24 Ultra)
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Lưu APK debug để cài thử (chỉ thử nội bộ)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wholewell-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Test JVM phần Kotlin (kho khóa)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  ci-ok:
    if: always()
    needs:
      - data-and-engine
      - food-library
      - dsld-library
      - journal-db
      - app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tổng hợp kết quả CI
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
