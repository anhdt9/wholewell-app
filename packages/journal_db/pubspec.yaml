name: journal_db
description: CSDL mã hóa trên máy của WholeWell (drift + SQLite3MultipleCiphers). Thuần Dart, không Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  drift: 2.35.4
  sqlite3: 3.9.1
  path: 1.9.1
  meta: ^1.15.0
  health_engine:
    path: ../health_engine
  cryptography: ^2.7.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0

# Dùng SQLite3MultipleCiphers thay SQLite gốc (docs/specs/encrypted-db.md).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
