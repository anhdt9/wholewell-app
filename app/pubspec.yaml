name: wholewell
description: MVP app sức khỏe cá nhân hóa theo RDA/AI, UL, ODA (dữ liệu ở máy).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.10.0
  health_engine:
    path: ../packages/health_engine
  journal_db:
    path: ../packages/journal_db
  food_library:
    path: ../packages/food_library
  dsld_library:
    path: ../packages/dsld_library
  path_provider: 2.1.6
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  google_mlkit_document_scanner: ^0.7.2
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reference_pack.json
    - assets/food_library.db
    - assets/food_library_manifest.json
    - assets/dsld_library.db.gz
    - assets/dsld_library_manifest.json

# CSDL mã hóa: dùng SQLite3MultipleCiphers thay SQLite gốc (docs/specs/encrypted-db.md).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
