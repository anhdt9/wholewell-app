name: wholewell
description: MVP app sức khỏe cá nhân hóa theo RDA/AI, UL, ODA (dữ liệu ở máy).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.10.0
  health_engine:
    path: ../packages/health_engine
  drift: 2.35.4
  sqlite3: 3.9.1
  path_provider: 2.1.6
  path: 1.9.1
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/reference_pack.json

# CSDL mã hóa: dùng SQLite3MultipleCiphers thay SQLite gốc (docs/specs/encrypted-db.md).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
