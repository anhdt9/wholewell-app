name: wholewell
description: MVP app sức khỏe cá nhân hóa theo RDA/AI, UL, ODA (dữ liệu ở máy).
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  health_engine:
    path: ../packages/health_engine
  journal_db:
    path: ../packages/journal_db
  food_library:
    path: ../packages/food_library
  dsld_library:
    path: ../packages/dsld_library
  path_provider: 2.1.6
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  google_mlkit_document_scanner: ^0.7.2
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Flavor mặc định khi không ghi --flavor: dev (app id riêng, không đụng dữ liệu của bản thật).
  default-flavor: dev
  uses-material-design: true
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
  assets:
    - assets/reference_pack.json
    - assets/food_library.db
    - assets/food_library_manifest.json
    - assets/dsld_library.db.gz
    - assets/dsld_library_manifest.json
